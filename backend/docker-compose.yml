version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports: ["5432:5432"]
  api:
    build: .
    depends_on: [db]
    environment:
      DB_URL: jdbc:postgresql://db:5432/analytics
      DB_USER: analytics
      DB_PASSWORD: analytics
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports: ["8080:8080"]
