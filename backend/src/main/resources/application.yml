server:
  port: 8080

spring:
  application:
    name: enterprise-ai-data-intelligence
  datasource:
    url: ${DB_URL:jdbc:h2:mem:analytics;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10m

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4.1}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
